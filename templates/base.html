<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Canvas Game Template</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D0F18;
      font-family: Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      background: #0D0F18;
      image-rendering: pixelated;
      touch-action: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const GAME = {
      canvas: document.getElementById('gameCanvas'),
      ctx: null,
      width: 800,
      height: 600,
      maxWidth: 800,
      maxHeight: 600,
      state: {},
      palette: ['#0D0F18', '#1D2233', '#4A90E2', '#F5A623', '#7ED321', '#FFFFFF'],
      screens: {},
      currentScreen: null,
      input: {
        x: 0,
        y: 0,
        pressed: false,
        justPressed: false,
        justReleased: false
      },
      lastTime: 0,
      audioCtx: null
    };

    GAME.ctx = GAME.canvas.getContext('2d');

    function resizeCanvas() {
      const w = Math.min(window.innerWidth, GAME.maxWidth);
      const h = Math.min(window.innerHeight, GAME.maxHeight);
      GAME.width = Math.max(320, Math.floor(w));
      GAME.height = Math.max(240, Math.floor(h));
      GAME.canvas.width = GAME.width;
      GAME.canvas.height = GAME.height;
      GAME.canvas.style.width = `${GAME.width}px`;
      GAME.canvas.style.height = `${GAME.height}px`;
    }

    function updatePointerPosition(clientX, clientY) {
      const rect = GAME.canvas.getBoundingClientRect();
      const scaleX = GAME.width / rect.width;
      const scaleY = GAME.height / rect.height;
      GAME.input.x = (clientX - rect.left) * scaleX;
      GAME.input.y = (clientY - rect.top) * scaleY;
    }

    function setPressed(nextPressed) {
      if (nextPressed && !GAME.input.pressed) GAME.input.justPressed = true;
      if (!nextPressed && GAME.input.pressed) GAME.input.justReleased = true;
      GAME.input.pressed = nextPressed;
    }

    GAME.canvas.addEventListener('mousedown', (event) => {
      updatePointerPosition(event.clientX, event.clientY);
      setPressed(true);
    });

    window.addEventListener('mousemove', (event) => {
      updatePointerPosition(event.clientX, event.clientY);
    });

    window.addEventListener('mouseup', () => {
      setPressed(false);
    });

    GAME.canvas.addEventListener('touchstart', (event) => {
      const touch = event.changedTouches[0];
      updatePointerPosition(touch.clientX, touch.clientY);
      setPressed(true);
      event.preventDefault();
    }, { passive: false });

    GAME.canvas.addEventListener('touchmove', (event) => {
      const touch = event.changedTouches[0];
      updatePointerPosition(touch.clientX, touch.clientY);
      event.preventDefault();
    }, { passive: false });

    GAME.canvas.addEventListener('touchend', (event) => {
      const touch = event.changedTouches[0];
      if (touch) updatePointerPosition(touch.clientX, touch.clientY);
      setPressed(false);
      event.preventDefault();
    }, { passive: false });

    function drawRect(x, y, w, h, color) {
      GAME.ctx.fillStyle = color;
      GAME.ctx.fillRect(x, y, w, h);
    }

    function drawCircle(x, y, r, color) {
      GAME.ctx.fillStyle = color;
      GAME.ctx.beginPath();
      GAME.ctx.arc(x, y, r, 0, Math.PI * 2);
      GAME.ctx.fill();
    }

    function drawText(text, x, y, options = {}) {
      const size = options.size ?? 22;
      const align = options.align ?? 'left';
      const color = options.color ?? '#FFFFFF';
      const baseline = options.baseline ?? 'middle';
      GAME.ctx.fillStyle = color;
      GAME.ctx.font = `${size}px Arial`;
      GAME.ctx.textAlign = align;
      GAME.ctx.textBaseline = baseline;
      GAME.ctx.fillText(text, x, y);
    }

    function isInsideRect(pointX, pointY, rect) {
      return pointX >= rect.x && pointX <= rect.x + rect.w && pointY >= rect.y && pointY <= rect.y + rect.h;
    }

    function drawButton(rect, label, options = {}) {
      const hovered = isInsideRect(GAME.input.x, GAME.input.y, rect);
      const baseColor = options.color ?? '#4A90E2';
      const hoverColor = options.hoverColor ?? '#6CAEFF';
      drawRect(rect.x, rect.y, rect.w, rect.h, hovered ? hoverColor : baseColor);
      drawText(label, rect.x + rect.w / 2, rect.y + rect.h / 2, { align: 'center', color: '#FFFFFF', size: options.textSize ?? 20 });
      return hovered && GAME.input.justPressed;
    }

    function playTone(freq = 440, duration = 0.08) {
      GAME.audioCtx = GAME.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = GAME.audioCtx.createOscillator();
      const gain = GAME.audioCtx.createGain();
      oscillator.type = 'square';
      oscillator.frequency.value = freq;
      gain.gain.value = 0.04;
      oscillator.connect(gain);
      gain.connect(GAME.audioCtx.destination);
      oscillator.start();
      oscillator.stop(GAME.audioCtx.currentTime + duration);
    }

    function registerScreen(name, screen) {
      GAME.screens[name] = screen;
    }

    function switchScreen(name) {
      GAME.currentScreen = GAME.screens[name] || null;
      if (GAME.currentScreen && GAME.currentScreen.enter) {
        GAME.currentScreen.enter(GAME);
      }
    }

    // === SCREENS ===
    registerScreen('boot', {
      update() {
        if (GAME.input.justPressed) playTone(620, 0.05);
      },
      render() {
        drawRect(0, 0, GAME.width, GAME.height, '#0D0F18');
        drawText('Canvas Template Ready', GAME.width / 2, GAME.height / 2 - 24, { align: 'center', size: 34 });
        drawText('Add your screens and call switchScreen("...")', GAME.width / 2, GAME.height / 2 + 18, { align: 'center', size: 18, color: '#AAB2D5' });
      }
    });

    // === GAME LOGIC ===
    function updateGame(dt) {
      if (GAME.currentScreen && GAME.currentScreen.update) {
        GAME.currentScreen.update(dt, GAME);
      }
    }

    function renderGame() {
      if (GAME.currentScreen && GAME.currentScreen.render) {
        GAME.currentScreen.render(GAME.ctx, GAME);
      }
    }

    function frame(timestamp) {
      const dt = Math.min(0.05, (timestamp - GAME.lastTime) / 1000 || 0);
      GAME.lastTime = timestamp;
      updateGame(dt);
      renderGame();
      GAME.input.justPressed = false;
      GAME.input.justReleased = false;
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    switchScreen('boot');
    requestAnimationFrame(frame);
  </script>
</body>
</html>
