# YAML comments are intentionally present here.
game_design:
  # Metadata for the knowledge fixture.
  title: "Game Design Reference"
  version: "1.0"
  
  core_mechanics:
    - name: "Combat System"
      type: "interaction"
      description: "Turn-based combat with action economy"
      complexity: "high"
      
    - name: "Progression System"
      type: "advancement"
      description: "Level-based character advancement"
      complexity: "medium"
  
  economy:
    currencies:
      gold:
        sources:
          - enemy_drops
          - quest_rewards
          - treasure_chests
        sinks:
          - equipment_purchase
          - skill_training
          - fast_travel
      gems:
        sources:
          - boss_drops
          - achievements
          - battle_pass
        sinks:
          - cosmetics
          - convenience_features
          - premium_content
    
    balance_rules:
      - "Sinks must equal sources over time"
      - "Inflation rate should not exceed 5% per session"
      - "Player agency in spending decisions"
  
  difficulty:
    curve: "exponential"
    scaling_factor: 1.15
    difficulty_modes:
      - name: "Easy"
        enemy_health_multiplier: 0.7
        reward_multiplier: 0.8
      - name: "Normal"
        enemy_health_multiplier: 1.0
        reward_multiplier: 1.0
      - name: "Hard"
        enemy_health_multiplier: 1.5
        reward_multiplier: 1.3
