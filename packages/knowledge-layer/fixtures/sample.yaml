# Game design configuration
# Note: comments will be stripped during parsing

game_design:
  core_mechanics:
    - combat_system:
        description: Turn-based combat with action economy management
        complexity: high
        enemy_response: true
    - progression_system:
        description: Level-based character advancement
        complexity: medium
  
  economy:
    action_economy:
      description: Resource management for turn-based actions
      complexity: high
    currencies:
      gold:
        sources:
          - enemy_drops
          - quest_rewards
        sinks:
          - equipment
          - consumables
